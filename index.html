<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AF7 Sample Books</title>
<style>
@font-face{font-family:Montserrat;font-weight:400;font-style:normal;font-display:swap;src:url(montserrat.woff2) format('woff2')}
:root{--navy:#1A2336;--deep:#121929;--line:rgba(255,255,255,.14);--soft:#C6C8CD;--ratio:1.2106}
*{box-sizing:border-box;margin:0;padding:0;font-weight:400;font-style:normal;letter-spacing:-0.01em}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 40%,#22304a 0%,var(--navy) 45%,var(--deep) 100%);color:#fff;font-family:Montserrat,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px clamp(16px,4vw,48px);border-bottom:1px solid var(--line)}
header img{height:34px;display:block}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-radius:999px;color:var(--soft);font:inherit;font-size:13px;line-height:1;padding:10px 14px;cursor:pointer;transition:background .2s,color .2s}
.tab:hover{color:#fff}
.tab[aria-selected=true]{background:#fff;color:var(--navy)}
.tab:focus-visible,.nav:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{flex:1;display:flex;align-items:center;justify-content:center;perspective:3200px;position:relative;min-height:0;touch-action:pan-y}
.book{position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.645,.045,.355,1)}
.book::after{content:"";position:absolute;left:0;right:0;bottom:-6%;height:10%;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.45),transparent 70%);filter:blur(6px);transform:translateZ(-2px);pointer-events:none;transition:left .9s,right .9s}
.book.closed-front::after{left:50%}
.book.closed-back::after{right:50%}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.645,.045,.355,1);cursor:pointer}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff center/cover no-repeat;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face.blank{background:var(--navy)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.face.front::after{background:linear-gradient(90deg,rgba(0,0,0,.22) 0%,rgba(0,0,0,.06) 3%,transparent 9%)}
.face.back::after{background:linear-gradient(270deg,rgba(0,0,0,.22) 0%,rgba(0,0,0,.06) 3%,transparent 9%)}
.face.front.cover::after,.face.back.cover::after{background:none}
.leaf .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0));opacity:0;transition:opacity 1.1s;backface-visibility:hidden}
.leaf.turning .shade{opacity:1}
.edge{position:absolute;top:0;bottom:0;width:6px;pointer-events:none;background:repeating-linear-gradient(90deg,#e9eaed 0 1px,#c9ccd2 1px 2px);opacity:.9}
footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,4vw,48px) 22px;border-top:1px solid var(--line)}
.meta{font-size:13px;color:var(--soft);min-width:0}
.meta b{color:#fff;margin-right:12px}
.controls{display:flex;align-items:center;gap:10px}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .2s,border-color .2s,opacity .2s}
.nav:hover:not(:disabled){background:#fff;color:var(--navy);border-color:#fff}
.nav:disabled{opacity:.3;cursor:default}
.nav svg{width:18px;height:18px}
.count{font-size:13px;color:var(--soft);min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.45);pointer-events:none;transition:opacity .6s}
@media (max-width:720px){header{flex-direction:column;align-items:flex-start;gap:14px;padding-bottom:14px}.tabs{width:100%}.meta b{display:block;margin:0 0 4px}}
@media (prefers-reduced-motion:reduce){.leaf,.book,.book::after{transition-duration:.01s}}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="AF7 Apparel Fastener">
  <nav class="tabs" role="tablist" aria-label="Sample books"></nav>
</header>
<main id="stage" aria-live="polite">
  <div class="book" id="book"></div>
  <div class="hint" id="hint">Click a page or use the arrow keys to turn</div>
</main>
<footer>
  <div class="meta" id="meta"></div>
  <div class="controls">
    <button class="nav" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="count" id="count"></span>
    <button class="nav" id="next" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</footer>
<script>
const BOOKS=[["Metal Zippers",6],["Aluminium Zippers",4],["Nylon Coil Zippers",4],["Moulded Plastic Zippers",4],["Tag Strings",4],["Metal Tipping",4],["TPU Tipping",4]];
let start=1;const books=BOOKS.map(([n,c],i)=>{const pages=[];for(let k=0;k<c;k++)pages.push(`p/pg-${String(start+k).padStart(2,"0")}.jpg`);start+=c;return{name:n,pages,no:String(i+1).padStart(2,"0")}});
const tabs=document.querySelector(".tabs"),book=document.getElementById("book"),stage=document.getElementById("stage"),
prev=document.getElementById("prev"),next=document.getElementById("next"),count=document.getElementById("count"),meta=document.getElementById("meta"),hint=document.getElementById("hint");
let cur=0,leaves=[],pos=0,real=0;
function size(){const r=stage.getBoundingClientRect();const R=1.2106;let h=Math.min(r.height*0.84,(r.width*0.9)/(2*R));book.style.height=h+"px";book.style.width=(2*R*h)+"px";}
function load(i){cur=i;pos=0;book.innerHTML="";[...tabs.children].forEach((t,k)=>t.setAttribute("aria-selected",k===i));
 const b=books[i],p=[...b.pages];const back=p.pop();if(p.length%2===0)p.push(null);p.push(back);real=b.pages.length;
 leaves=[];for(let l=0;l<p.length/2;l++){const el=document.createElement("div");el.className="leaf";
  const f=p[2*l],bk=p[2*l+1];
  el.innerHTML=`<div class="face front ${l===0?"cover":""} ${f?"":"blank"}" ${f?`style="background-image:url(${f})"`:""}></div><div class="face back ${l===p.length/2-1?"cover":""} ${bk?"":"blank"}" ${bk?`style="background-image:url(${bk})"`:""}></div><div class="shade"></div>`;
  el.addEventListener("click",()=>{el.classList.contains("flipped")?go(-1):go(1)});book.appendChild(el);leaves.push(el)}
 meta.innerHTML=`<b>${b.no}  ${b.name}</b>${real} pages`;render(true);
 b.pages.forEach(s=>{const im=new Image();im.src=s});}
function render(instant){const n=leaves.length;leaves.forEach((el,k)=>{const f=k<pos;el.classList.toggle("flipped",f);
  if(instant){el.style.zIndex=f?k+1:n-k;el.style.transition="none"}});
 if(instant)requestAnimationFrame(()=>leaves.forEach(el=>el.style.transition=""));
 book.classList.toggle("closed-front",pos===0);book.classList.toggle("closed-back",pos===n);
 book.style.transform=pos===0?"translateX(-25%) rotateX(4deg)":pos===n?"translateX(25%) rotateX(4deg)":"rotateX(4deg)";
 prev.disabled=pos===0&&cur===0;next.disabled=pos===n&&cur===books.length-1;
 const label=pos===0?"Cover":pos===n?"Back cover":`Pages ${pos*2} to ${pos*2+1}`;count.textContent=label;}
function go(d){const n=leaves.length;
 if(d>0&&pos===n){if(cur<books.length-1)load(cur+1);return}
 if(d<0&&pos===0){if(cur>0){load(cur-1);pos=leaves.length;render(true)}return}
 const el=leaves[d>0?pos:pos-1];el.classList.add("turning");setTimeout(()=>el.classList.remove("turning"),1100);
 el.style.zIndex=n+5;pos+=d;setTimeout(()=>render(false),0);setTimeout(()=>{leaves.forEach((e,k)=>e.style.zIndex=k<pos?k+1:n-k)},1100);
 hint.style.opacity=0;}
books.forEach((b,i)=>{const t=document.createElement("button");t.className="tab";t.role="tab";t.textContent=b.name;t.onclick=()=>load(i);tabs.appendChild(t)});
prev.onclick=()=>go(-1);next.onclick=()=>go(1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
let sx=null;stage.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
stage.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(dx<0?1:-1);sx=null});
addEventListener("resize",size);size();load(0);
</script>
</body>
